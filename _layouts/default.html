<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <title>{{ page.title | default: site.title | escape }}{% if page.title %} · {{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website"><meta property="og:title" content="{{ page.title | default: site.title | escape }}"><meta property="og:description" content="{{ page.description | default: site.description | escape }}"><meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}"><link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body><a class="skip" href="#main">Skip to content</a>
<header><a class="brand" href="{{ '/' | relative_url }}">gh<span>.dh6k</span>.vip</a><nav aria-label="Primary"><a lang="vi" hreflang="vi" href="{{ '/vi/' | relative_url }}"{% if page.lang == 'vi' %} aria-current="page"{% endif %}>VI</a><a lang="en" hreflang="en" href="{{ '/en/' | relative_url }}"{% if page.lang == 'en' %} aria-current="page"{% endif %}>EN</a><a href="{{ '/suggested-filter/' | relative_url }}">Filters</a><a href="{{ '/mov/' | relative_url }}">MOV</a></nav></header>
<main id="main">{{ content }}</main><footer><span>Built with plain Jekyll.</span><a href="{{ '/sitemap.xml' | relative_url }}">Sitemap</a><a href="{{ page.path | prepend: '/' | relative_url }}">Source</a></footer></body></html>
